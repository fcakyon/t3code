name: Fork Nightly Release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: fork-nightly-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  sync_upstream:
    name: Sync upstream/main -> main -> nightly
    if: github.repository == 'fcakyon/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
      ref: ${{ steps.sync.outputs.ref }}
    steps:
      - name: Sync main with upstream/main and merge into nightly
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add upstream "https://github.com/pingdotgg/t3code.git"

          git fetch --no-tags origin main nightly
          git fetch --no-tags upstream main

          # 1. Keep origin/main identical to upstream/main
          git checkout -B main origin/main
          if ! git merge --ff-only upstream/main; then
            echo "::warning::origin/main could not fast-forward to upstream/main; resetting origin/main to upstream/main so main stays pure upstream."
            git reset --hard upstream/main
            git push --force-with-lease origin main
          elif [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            git push origin main
          fi

          # 2. Merge main into nightly unless it already contains it
          git checkout -B nightly origin/nightly
          if ! git merge-base --is-ancestor main nightly; then
            if ! git merge --no-edit main; then
              git merge --abort || true
              echo "::error::Merge conflict syncing upstream/main into nightly. T3 Code scheduled agent will resolve it."
              exit 1
            fi
            git push origin nightly
          fi

          # 3. Build only when nightly has commits the latest release lacks
          ref="$(git rev-parse HEAD)"
          released="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq '.[0].target_commitish // ""')"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$ref" != "$released" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "nightly ${ref} is already released."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build_linux:
    name: Build JS bundle & Linux x64 CLI
    needs: [sync_upstream]
    if: github.repository == 'fcakyon/t3code' && needs.sync_upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      short_sha: ${{ steps.release_meta.outputs.short_sha }}
      ref: ${{ needs.sync_upstream.outputs.ref }}
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.sync_upstream.outputs.ref }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - id: release_meta
        name: Resolve nightly release version
        shell: bash
        env:
          NIGHTLY_DATE: ${{ github.run_started_at }}
          NIGHTLY_SHA: ${{ needs.sync_upstream.outputs.ref }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          nightly_date="$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)"
          node scripts/resolve-nightly-release.ts \
            --date "$nightly_date" \
            --run-number "$NIGHTLY_RUN_NUMBER" \
            --sha "$NIGHTLY_SHA" \
            --github-output

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ steps.release_meta.outputs.version }}"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config patchelf

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop

      - name: Apply nightly web client branding
        run: node scripts/apply-web-brand-assets.ts nightly apps/server/dist/client

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

      - name: Cache Linux x64 resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
          key: resource-monitor-x86_64-unknown-linux-gnu-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux x64 resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Stage Linux x64 resource monitor
        run: |
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/t3-resource-monitor"

      - name: Build Linux x64 CLI single-executable
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build Linux x64 CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ steps.release_meta.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test Linux x64 CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ steps.release_meta.outputs.version }}"

      - name: Upload Linux x64 CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

  build_mac_arm64:
    name: Build macOS arm64 Desktop & CLI
    needs: [build_linux]
    if: ${{ !cancelled() && needs.build_linux.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.build_linux.outputs.ref }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.build_linux.outputs.version }}"

      - name: Download JS bundle
        uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps

      - name: Cache macOS arm64 resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build macOS arm64 resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target aarch64-apple-darwin

      - name: Stage macOS arm64 resource monitor
        run: |
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/darwin-arm64"
          cp native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/darwin-arm64/t3-resource-monitor"

      - name: Build macOS arm64 CLI single-executable
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build macOS arm64 CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform mac \
            --arch arm64 \
            --version "${{ needs.build_linux.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test macOS arm64 CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.build_linux.outputs.version }}"

      - name: Upload macOS arm64 CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-mac-arm64
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

      - name: Build macOS arm64 desktop artifact
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_DESKTOP_UPDATE_REPOSITORY: fcakyon/t3code
        run: |
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ needs.build_linux.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Collect macOS desktop release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.dmg" "release/*.zip" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              [[ "$file" == */builder-debug.yml ]] && continue
              cp "$file" release-publish/
            done
          done

      - name: Upload macOS arm64 desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-arm64
          path: release-publish/*
          if-no-files-found: error
          retention-days: 1

  publish_release:
    name: Publish Fork Nightly Release
    needs: [build_linux, build_mac_arm64]
    if: ${{ !failure() && !cancelled() && needs.build_linux.result == 'success' && needs.build_mac_arm64.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(t3-*.tar.gz)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build_linux.outputs.tag }}
          TITLE: ${{ needs.build_linux.outputs.release_name }}
          TARGET: ${{ needs.build_linux.outputs.ref }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.blockmap
            release-assets/*.yml
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          )
          gh release create "$TAG" "${files[@]}" \
            --repo "$GH_REPO" \
            --target "$TARGET" \
            --title "$TITLE" \
            --notes "Nightly build from \`${TARGET}\`." \
            --prerelease
